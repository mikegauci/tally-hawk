[project]
name = "tallyhawk"
version = "0.1.0"
description = "AI invoice extraction and PO matching for accounts payable teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.15",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pillow>=12.3.0",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
]

[project.scripts]
tallyhawk = "tallyhawk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = [".", "tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real OpenAI API (costs money); run with -m live"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
