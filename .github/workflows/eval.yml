name: Extraction eval

# Calls the OpenAI API on all 68 invoices, so it runs on demand rather than on every push.
# Needs an OPENAI_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model ID
        default: gpt-5.5
      effort:
        description: Effort level
        default: medium
      tag:
        description: Only invoices with this tag (e.g. hard); empty for all
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m evals.run_eval --model "${{ inputs.model }}" --effort "${{ inputs.effort }}" ${TAG:+--tag "$TAG"} | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAG: ${{ inputs.tag }}
          TALLYHAWK_PRICE_INPUT_PER_MTOK: ${{ vars.TALLYHAWK_PRICE_INPUT_PER_MTOK }}
          TALLYHAWK_PRICE_OUTPUT_PER_MTOK: ${{ vars.TALLYHAWK_PRICE_OUTPUT_PER_MTOK }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
